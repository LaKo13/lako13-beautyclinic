name: Claude Code

# @claude on issues/PRs -> Claude Code run billed to Laurent's Claude subscription
# (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`). Only LaKo13 can trigger it.
# Model: sonnet by default; add [opus] or [haiku] to the request to switch.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run at a time per issue/PR; queued runs wait instead of overlapping.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Must mention @claude AND be authored/sent by LaKo13, so outsiders can't spend the quota.
    if: |
      github.event.sender.login == 'LaKo13' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == 'LaKo13') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == 'LaKo13') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.login == 'LaKo13') ||
        (github.event_name == 'issues' && github.event.issue.user.login == 'LaKo13' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # required by the action's Claude GitHub App auth
      actions: read     # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so Claude can merge main into PR branches

      # Runtime + deps so Claude can run the repo's checks before pushing.
      # Same file in every repo: each step only runs if its manifest exists.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          # Use the repo's .nvmrc when it has one, else Node 22.
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && '22' || '' }}
      - name: Install JS dependencies
        if: hashFiles('package.json') != ''
        continue-on-error: true   # let Claude see and fix a broken install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Set up Python
        if: hashFiles('requirements*.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        if: hashFiles('requirements*.txt', 'pyproject.toml') != ''
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt requirements-dev.txt; do if [ -f "$f" ]; then pip install -r "$f"; fi; done
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          pip install pytest ruff

      # Model per request: default sonnet; "[opus]" or "[haiku]" in the triggering
      # comment / review / issue picks that model ([opus] wins if both appear).
      # Text is passed via env, never interpolated into the script.
      - name: Pick model
        id: model
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          case "$EVENT" in
            issue_comment|pull_request_review_comment) text="$COMMENT_BODY" ;;
            pull_request_review) text="$REVIEW_BODY" ;;
            issues) text="$ISSUE_TITLE $ISSUE_BODY" ;;
            *) text="" ;;
          esac
          model=sonnet
          case "$text" in
            *"[opus]"*) model=opus ;;
            *"[haiku]"*) model=haiku ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Selected model: $model"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          # Only pass LaKo13's (and Claude's own) comments into Claude's context.
          include_comments_by_actor: "LaKo13,claude[bot]"
          # Bash is limited to installs, checks and safe git (merge main in, never
          # rebase or force-push). No curl/wget or other network tools.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --max-turns 60
            --allowedTools "Bash(git fetch:*),Bash(git merge:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm test:*),Bash(npm run:*),Bash(npx tsc:*),Bash(pnpm install:*),Bash(pnpm test:*),Bash(pnpm run:*),Bash(pnpm exec tsc:*),Bash(corepack enable:*),Bash(node:*),Bash(pip install:*),Bash(python -m pip install:*),Bash(pytest:*),Bash(python -m pytest:*),Bash(python:*),Bash(ruff:*),Bash(python -m ruff:*)"
            --disallowedTools "Bash(git rebase:*),Bash(git push * --force*),Bash(git push --force*),Bash(git push * -f),Bash(git push * -f *),Bash(git push -f *),Bash(git push *+*),Bash(git push * --mirror*),Bash(git push * --delete*),Bash(git push * -d *),Bash(git reset --hard*),Bash(curl:*),Bash(wget:*)"
